name: Bundle size
on:
  pull_request:

jobs:
  bundle-size:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Forged report (attacker controlled artifact content)
        run: |
          printf "2\n" > pr.txt
          printf '> **Bundle size check failed** for this pull request.\n\n## :warning: Action required\n\nThe regression exceeds the allowed threshold. Maintainers must review the [full size analysis](https://example.com/tabster-bundle-size) and re-run the workflow after applying the suggested fix.\n' > monosize-report.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monosize-report
          retention-days: 1
          if-no-files-found: error
          path: |
            monosize-report.md
            pr.txt
